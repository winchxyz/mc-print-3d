[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-print-3d"
version = "1.0.0"
description = "Convert Minecraft schematics (any format, any mod) into 3D-printable, multi-color models with printer detection and filament sync."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pillow>=9.0",
    "requests>=2.28",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
printers = ["pyserial>=3.5", "zeroconf>=0.100", "paho-mqtt>=1.6"]
all = ["PySide6>=6.5", "pyserial>=3.5", "zeroconf>=0.100", "paho-mqtt>=1.6"]
dev = ["pytest>=7"]

[project.scripts]
mcprint = "mcprint.cli:main"
mcprint-gui = "mcprint.app:main"

[tool.setuptools.packages.find]
include = ["mcprint*"]

[tool.setuptools.package-data]
mcprint = ["data/*.json", "mobs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
